[project]
name = "cheiron"
version = "0.1.0"
description = "ClinicalTrials.gov query-to-visualization backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/backend/src"]
addopts = "-ra -p no:langsmith_plugin"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["apps/backend/src", "stubs"]
files = ["apps/backend/src", "tests"]
strict = true
